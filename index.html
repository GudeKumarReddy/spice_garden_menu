<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Digital restaurant menu">
  <title>Restaurant Menu</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="site-header">
    <div class="brand-wrap">
      <img id="restaurantLogo" class="restaurant-logo" src="logo.svg" alt="Restaurant logo">
      <div class="brand-copy">
        <h1 id="restaurantName">Restaurant</h1>
        <p id="restaurantDescription" class="tagline"></p>
        <p id="restaurantAddress" class="address"></p>
        <p id="workingHours" class="hours"></p>
      </div>
    </div>

    <div class="contact-actions">
      <a id="callButton" class="contact-btn" href="#">☎ Call</a>
      <a id="whatsappButton" class="contact-btn" href="#" target="_blank" rel="noopener">WhatsApp</a>
      <a id="emailButton" class="contact-btn secondary hidden" href="#">Email</a>
    </div>
  </header>

  <section class="menu-controls">
    <div class="food-tabs" role="tablist" aria-label="Food type">
      <button class="food-tab active veg-tab" data-type="VEG" type="button">
        <span class="food-dot veg-dot"></span> Veg
      </button>
      <button class="food-tab nonveg-tab" data-type="NONVEG" type="button">
        <span class="food-dot nonveg-dot"></span> Non-Veg
      </button>
    </div>

    <div class="search-wrap">
      <input id="searchInput" type="search" placeholder="Search dishes..." autocomplete="off">
    </div>

    <nav id="categoryNav" class="category-nav" aria-label="Menu categories"></nav>
  </section>

  <main>
    <div id="loading" class="status">Loading menu...</div>
    <div id="error" class="status error hidden"></div>
    <div id="emptyState" class="status hidden">No matching menu items.</div>
    <div id="menuContainer" class="menu-container"></div>
  </main>

  <footer class="site-footer">
    <div class="footer-restaurant">
      <strong id="footerRestaurantName">Restaurant</strong>
      <span id="footerPhone"></span>
    </div>
    <div class="creator-credit">
      <span>Contact us for websites like this:</span>
      <strong id="developerName">UV Web Creations</strong>
      <a id="developerPhone" href="tel:+919392417891">9392417891</a>
    </div>
  </footer>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
