<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spice Garden | Menu Admin</title>
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <main class="shell">
    <section id="loginCard" class="panel login">
      <h1>Spice Garden Menu Admin</h1>
      <p>Enter your admin password.</p>
      <input id="password" type="password" placeholder="Admin password">
      <button id="loginBtn" class="primary">Login</button>
      <p id="loginMessage" class="error"></p>
    </section>

    <section id="dashboard" class="hidden">
      <div class="topbar">
        <div>
          <h1>Spice Garden Admin</h1>
          <p>Manage restaurant details, categories, dishes and photos.</p>
        </div>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <section class="panel">
        <h2>Restaurant Details</h2>
        <div class="grid two">
          <label>Restaurant Name<input id="restaurant_name"></label>
          <label>Phone<input id="phone"></label>
          <label>WhatsApp<input id="whatsapp"></label>
          <label>Email<input id="email" type="email"></label>
          <label class="wide">Address<textarea id="address"></textarea></label>
          <label class="wide">Description<textarea id="description"></textarea></label>
          <label>Working Hours<input id="working_hours"></label>
          <label>Logo Image<input id="logoFile" type="file" accept="image/*"></label>
        </div>
        <button id="saveSettingsBtn" class="primary">Save Restaurant Details</button>
        <p id="settingsMessage"></p>
      </section>

      <section class="panel">
        <h2>Categories</h2>
        <form id="categoryForm">
          <input id="categoryId" type="hidden">
          <div class="grid three">
            <label>Type
              <select id="categoryFoodType">
                <option value="VEG">VEG</option>
                <option value="NONVEG">NONVEG</option>
                <option value="SHARED">SHARED</option>
              </select>
            </label>
            <label>Name<input id="categoryName" required></label>
            <label>Order<input id="categoryOrder" type="number" min="1" value="1" required></label>
          </div>
          <label class="check"><input id="categoryActive" type="checkbox" checked> Active</label>
          <button class="primary" type="submit">Save Category</button>
          <button id="cancelCategory" class="secondary hidden" type="button">Cancel</button>
        </form>
        <div id="categoryList" class="list"></div>
      </section>

      <section class="panel">
        <h2>Menu Items</h2>
        <form id="itemForm">
          <input id="itemId" type="hidden">
          <div class="grid two">
            <label>Category<select id="itemCategory" required></select></label>
            <label>Item Name<input id="itemName" required></label>
            <label class="wide">Description<textarea id="itemDescription"></textarea></label>
            <label>Price (₹)<input id="itemPrice" type="number" min="0" step="1" required></label>
            <label>Badge<input id="itemBadge" placeholder="Popular / Bestseller"></label>
            <label>Order<input id="itemOrder" type="number" min="1" value="1" required></label>
            <label>Food Photo<input id="itemPhoto" type="file" accept="image/*"></label>
          </div>
          <label class="check"><input id="itemAvailable" type="checkbox" checked> Available</label>
          <button class="primary" type="submit">Save Item</button>
          <button id="cancelItem" class="secondary hidden" type="button">Cancel</button>
        </form>
        <p id="itemMessage"></p>

        <div class="filters">
          <button class="filter active" data-filter="ALL" type="button">All</button>
          <button class="filter" data-filter="VEG" type="button">Veg</button>
          <button class="filter" data-filter="NONVEG" type="button">Non-Veg</button>
          <button class="filter" data-filter="SHARED" type="button">Shared</button>
        </div>

        <div id="itemList" class="list"></div>
      </section>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
